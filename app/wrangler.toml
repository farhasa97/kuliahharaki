name = "kuliahharaki"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Fail statik dalam public/. Worker hanya dijalankan untuk laluan API, log masuk, webhook dan admin.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/bcl/*", "/admin/*"]

# Bukan rahsia. Rahsia (BCL_WEBHOOK_KEY, BCL_API_TOKEN, ADMIN_TOKEN) diset di dashboard Cloudflare.
[vars]
GOOGLE_CLIENT_ID = "369129694375-7so4q5csbho2qkdjgnesm2086d9l789j.apps.googleusercontent.com"
BUY_URL = "https://kuliahharaki.bcl.my/form/langgan-advance"
BCL_FORM_ID = "20826"
TANGGUH_HARI = "3"
HARGA_TEKS = "RM10 sebulan atau RM100 setahun" # dipaparkan kepada pelajar; ikut harga dalam borang BCL
HARGA_BULANAN = "10"  # kad yuran; mesti sama dengan item ADVANCE BULANAN dalam borang BCL
HARGA_TAHUNAN = "100" # kad yuran; mesti sama dengan item ADVANCE TAHUNAN dalam borang BCL
SITE_URL = "https://kuliahharaki.com" # alamat utama (canonical, sitemap). Tukar di sini jika domain berubah
ADMIN_EMELS = "annurprosolutions@gmail.com,farhan.sazali15@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "kuliahharaki"
database_id = "6245241e-0433-4b18-b32d-103a6a8965ea" # bukan rahsia
migrations_dir = "migrations"

# Nota PDF. Bucket dicipta di dashboard (R2 Object Storage), tanpa akses awam: fail hanya keluar melalui Worker.
[[r2_buckets]]
binding = "NOTA"
bucket_name = "kuliahharaki-fail"

[observability]
enabled = true
